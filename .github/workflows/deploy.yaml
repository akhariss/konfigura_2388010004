name: Build and Deploy to EC2

on:
  push:
    branches: [ main ] # Change to your default branch
  workflow_dispatch:   # Allows manual triggering from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web-dinamis
          file: ./web-dinamis/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/konfigura_2388010004:latest
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            docker rm -f konfigura_2388010004 || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/konfigura_2388010004:latest
            docker run -d --name konfigura_2388010004 --restart unless-stopped -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/konfigura_2388010004:latest